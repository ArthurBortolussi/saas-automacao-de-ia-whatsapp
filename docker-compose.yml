# Somente para desenvolvimento local. Credenciais abaixo NÃO são de produção.
services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: arthur
      POSTGRES_PASSWORD: arthur_dev_password
      POSTGRES_DB: arthur_ai
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./docker/postgres-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U arthur -d arthur_ai"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  postgres-data:
